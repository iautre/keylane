main:
  push:
    - services:
        - docker
      stages:
        - name: Build and push beta and latest images
          script: |
            build_number="$(git rev-list --count "$CNB_COMMIT")"
            tag="$(printf 'beta%05d' "$build_number")"
            image="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${image}:${tag}" \
              --tag "${image}:latest" \
              --push .

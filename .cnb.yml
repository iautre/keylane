main:
  push:
    - services:
        - docker
      stages:
        - name: Build and push latest image
          script: |
            image="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --tag "${image}:latest" \
              --push .

services:
  keylane:
    image: ${KEYLANE_IMAGE:-docker.cnb.cool/autre/keylane:latest}
    container_name: keylane
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_ENABLED: "false"
      DATABASE_PATH: /data/keylane.db
      HTTP_SERVER_ADDR: ":8080"
    ports:
      - "${PORT:-18080}:8080"
    volumes:
      - keylane-data:/data

volumes:
  keylane-data:
